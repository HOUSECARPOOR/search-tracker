name: 네이버 검색량 수집

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 한국시간 오전 9시
  workflow_dispatch: {}    # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SEARCHAD_API_KEY: ${{ secrets.SEARCHAD_API_KEY }}
          SEARCHAD_SECRET: ${{ secrets.SEARCHAD_SECRET }}
          SEARCHAD_CUSTOMER_ID: ${{ secrets.SEARCHAD_CUSTOMER_ID }}
        run: python collector/collect.py
      - name: 결과 저장
        run: |
          git config user.name "search-bot"
          git config user.email "search-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "검색량 데이터 갱신 $(date -u +%F)"
          git push
