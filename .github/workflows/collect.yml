name: 네이버 검색량 수집

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 한국시간 오전 9시
  workflow_dispatch: {}    # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SEARCHAD_API_KEY: ${{ secrets.SEARCHAD_API_KEY }}
          SEARCHAD_SECRET: ${{ secrets.SEARCHAD_SECRET }}
          SEARCHAD_CUSTOMER_ID: ${{ secrets.SEARCHAD_CUSTOMER_ID }}
        run: python collector/collect.py || echo "COLLECT_FAILED=1" >> "$GITHUB_ENV"
      - name: 결과 저장
        run: |
          git config user.name "search-bot"
          git config user.email "search-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "검색량 데이터 갱신 $(date -u +%F)"
          git push
      - name: 수집 오류 알림
        if: env.COLLECT_FAILED == '1'
        run: |
          echo "수집 중 오류가 있었습니다. '수집' 단계 로그를 확인하세요."
          exit 1
